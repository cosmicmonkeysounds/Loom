# Mosquitto on the house PC (John's Desktop) - written by setup-mosquitto.ps1.
#
# Two listeners, each with its own rules (per_listener_settings):
#   127.0.0.1:1883  anonymous, THIS PC ONLY: stagehand show + lights,
#                   Zigbee2MQTT (and the router, if it runs here)
#   <LAN>:1884      password-only (user `props`): the MacBook's audio
#                   router (trapped.macbook.yaml) and any network prop
#                   (WLED controllers: Config -> Sync Interfaces -> MQTT)
# Nobody on the house Wi-Fi can publish show/announce or a sensor topic
# without the props password. Check from the MacBook:
#   mosquitto_pub -h <this PC> -p 1883 -t show/announce -m hi   -> refused
#
# The password file lives outside "Program Files" (no space in its path,
# and a non-admin `mosquitto_passwd` can never rewrite it there by accident).

per_listener_settings true

listener 1883 127.0.0.1
allow_anonymous true

listener 1884
allow_anonymous false
password_file @PASSWORD_FILE@
