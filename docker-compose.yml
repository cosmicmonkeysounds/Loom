# Loom — full stack: Postgres + the event server + Caddy (editor + TLS).
#
#   cp .env.example .env       # then fill in the secrets
#   docker compose up -d --build
#
# → play app at /            (guests join here)
# → author editor at /edit/  (sign up, write, run events)
# → wall terminals at /terminal/, the web reinstallation game at
#   /reinstall/ (house map editor: /reinstall/map)
#
# Full walkthrough: docs/loom-docker-deploy.md

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: loom
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loom -d loom"]
      interval: 5s
      timeout: 3s
      retries: 20

  loom:
    build:
      context: .
      target: server
    # Pinned per release (deploy/release.sh writes LOOM_TAG into .env and
    # keeps the previous tag's images for deploy/rollback.sh).
    image: loom-server:${LOOM_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://loom:${POSTGRES_PASSWORD}@db:5432/loom
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?generate one with `openssl rand -base64 32` and set it in .env}
      LOOM_BASE_URL: ${LOOM_BASE_URL:?set LOOM_BASE_URL in .env, e.g. http://YOUR_VPS_IP or https://loom.example.com}
      # Caddy is the only route in, so rate-limit on the real client IP.
      LOOM_TRUST_PROXY: "1"
      # Door-rush throttles (blank = defaults; see .env.example). On the
      # night every phone on the house Wi-Fi shares one public IP.
      LOOM_RL_RESOLVE: ${LOOM_RL_RESOLVE:-}
      LOOM_RL_REGISTER: ${LOOM_RL_REGISTER:-}
      LOOM_RL_LOGIN_FAILURES: ${LOOM_RL_LOGIN_FAILURES:-}
      LOOM_RL_REDEEM_MISSES: ${LOOM_RL_REDEEM_MISSES:-}
      LOOM_RL_WIDGETS: ${LOOM_RL_WIDGETS:-}
      LOOM_RL_WALLET: ${LOOM_RL_WALLET:-}
      # Coalesce phone + booth snapshots (ms; blank/0 = off — the K-32 contingency).
      LOOM_SNAPSHOT_MS: ${LOOM_SNAPSHOT_MS:-}
      # Share-invite email (either transport; both blank = links only).
      LOOM_SMTP_URL: ${LOOM_SMTP_URL:-}
      LOOM_RESEND_API_KEY: ${LOOM_RESEND_API_KEY:-}
      LOOM_MAIL_FROM: ${LOOM_MAIL_FROM:-}
      # The webmaster outbox at /webmaster/ (needs LOOM_RESEND_API_KEY too).
      LOOM_WEBMASTER_PASSWORD: ${LOOM_WEBMASTER_PASSWORD:-}
      LOOM_WEBMASTER_FROM: ${LOOM_WEBMASTER_FROM:-}
      LOOM_WEBMASTER_REPLY_TO: ${LOOM_WEBMASTER_REPLY_TO:-}
      # The wall terminals + the TV speak with the devices' own voices — no
      # server voice by default (blank / `off`). Opt in to one shared
      # neural voice: the `kokoro` service below (`--profile tts`, and
      # LOOM_TTS_URL=http://kokoro:8880/v1) or any OpenAI-compatible URL.
      LOOM_TTS_URL: ${LOOM_TTS_URL:-off}
      LOOM_TTS_API_KEY: ${LOOM_TTS_API_KEY:-}
      LOOM_TTS_MODEL: ${LOOM_TTS_MODEL:-kokoro}
      LOOM_TTS_VOICE: ${LOOM_TTS_VOICE:-am_michael}
      # Web Push (K-31a): `npx web-push generate-vapid-keys`, once, into
      # .env — never rotated before the show. Blank = push off.
      LOOM_VAPID_PUBLIC_KEY: ${LOOM_VAPID_PUBLIC_KEY:-}
      LOOM_VAPID_PRIVATE_KEY: ${LOOM_VAPID_PRIVATE_KEY:-}
      LOOM_VAPID_SUBJECT: ${LOOM_VAPID_SUBJECT:-}
      # iPhone Home Screen push (K-31b): `on` to offer Add to Home Screen.
      LOOM_HOMESCREEN: ${LOOM_HOMESCREEN:-}
      # The reinstallation games + terminals share one house map
      # (docs/loom-reinstall.md §1.3). It belongs to the project: its
      # house.json (+ house.<variant>.json) are project files, snapshotted
      # at launch. A director's save from /reinstall/map wins over it and
      # lives per event in the state volume as spatial-house.json
      # (/data/spatial-house.json for the default event,
      # /data/<eventId>/spatial-house.json for the rest). LOOM_HOUSE is
      # only the fallback (the default event, events with no map snapshot);
      # the image bakes in the show's house.json. To pin another, bind-mount
      # its directory read-only outside /data (see the commented volume
      # below; its house.<variant>.json siblings become variants) and
      # uncomment — never set it blank (an empty path is not "unset"). The
      # file is re-read when it changes.
      # LOOM_HOUSE: /config/house.json
      # The facts judge's answer key (the hunt questions, the scannable
      # facts, the truth-or-dare questions). Like the map it belongs to the
      # project: a project's facts.json is snapshotted at launch and wins.
      # LOOM_FACTS is only the fallback (default: facts.json beside the
      # house map). Same rule as LOOM_HOUSE: bind-mount, never blank.
      # LOOM_FACTS: /config/facts.json
      # Optional: pin the default event's passcodes (otherwise auto-generated
      # and printed in the logs + saved under the state volume):
      # LOOM_EVENT_PASS: ...
      # LOOM_MOD_PASS: ...
      # LOOM_PRIME_PASS: ...
    volumes:
      - loom-state:/data
      # With LOOM_HOUSE above: your own house maps, read-only (a directory,
      # so a `cp` over house.json is seen — a single-file mount keeps the old inode).
      # - ./show-map:/config:ro   (scripts/ops/ship.sh never deletes it)
    depends_on:
      db:
        condition: service_healthy
    # Healthy = /api/health answers 200: with a database, only once the
    # control plane is up AND every live event is rehydrated (a loom that
    # booted before Postgres answers 503 until it catches up). An image
    # older than the route (a rollback target) answers 404 there, so that
    # falls back to the play shell at `/`.
    healthcheck:
      test: ["CMD", "node", "-e", "const u='http://127.0.0.1:7000';fetch(u+'/api/health').then(r=>r.status===404?fetch(u+'/'):r).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # OPT-IN (the `tts` profile): a neural voice for the terminals (Kokoro-82M,
  # CPU). A plain `docker compose up` does not start it — the devices speak
  # for themselves. To use it: COMPOSE_PROFILES=tts (or `--profile tts`) and
  # LOOM_TTS_URL=http://kokoro:8880/v1 in .env. Internal only — the event
  # server proxies + caches it at /api/mod/tts, so no port is published.
  # `cpus:` caps it so a burst of syntheses can never starve the event
  # server (Kokoro serves one synthesis at a time and would otherwise take
  # every core): set KOKORO_CPUS to (VPS cores - 1). The server does not
  # wait for it — while it is down the terminals use their own voices.
  # docs/loom-docker-deploy.md §5¾ "The voice".
  kokoro:
    profiles: ["tts"]
    image: ${KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-cpu:v0.9.0}
    restart: unless-stopped
    cpus: ${KOKORO_CPUS:-1}
    environment:
      API_LOG_LEVEL: WARNING
      # Warm the model with the voice the server asks for.
      DEFAULT_VOICE: ${LOOM_TTS_VOICE:-am_michael}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/v1/audio/voices', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  caddy:
    build:
      context: .
      target: proxy
    image: loom-proxy:${LOOM_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      INVITE_ADDRESS: ${INVITE_ADDRESS:-:8081}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - loom

volumes:
  pgdata:
  loom-state:
  caddy-data:
  caddy-config:
