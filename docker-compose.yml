# Loom — full stack: Postgres + the event server + Caddy (editor + TLS).
#
#   cp .env.example .env       # then fill in the secrets
#   docker compose up -d --build
#
# → play app at /            (guests join here)
# → author editor at /edit/  (sign up, write, run events)
# → wall terminals at /terminal/, the web reinstallation game at
#   /reinstall/ (house map editor: /reinstall/map)
#
# Full walkthrough: docs/loom-docker-deploy.md

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: loom
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loom -d loom"]
      interval: 5s
      timeout: 3s
      retries: 20

  loom:
    build:
      context: .
      target: server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://loom:${POSTGRES_PASSWORD}@db:5432/loom
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?generate one with `openssl rand -base64 32` and set it in .env}
      LOOM_BASE_URL: ${LOOM_BASE_URL:?set LOOM_BASE_URL in .env, e.g. http://YOUR_VPS_IP or https://loom.example.com}
      # Caddy is the only route in, so rate-limit on the real client IP.
      LOOM_TRUST_PROXY: "1"
      # Share-invite email (either transport; both blank = links only).
      LOOM_SMTP_URL: ${LOOM_SMTP_URL:-}
      LOOM_RESEND_API_KEY: ${LOOM_RESEND_API_KEY:-}
      LOOM_MAIL_FROM: ${LOOM_MAIL_FROM:-}
      # The webmaster outbox at /webmaster/ (needs LOOM_RESEND_API_KEY too).
      LOOM_WEBMASTER_PASSWORD: ${LOOM_WEBMASTER_PASSWORD:-}
      LOOM_WEBMASTER_FROM: ${LOOM_WEBMASTER_FROM:-}
      LOOM_WEBMASTER_REPLY_TO: ${LOOM_WEBMASTER_REPLY_TO:-}
      # The wall terminals' voice: an OpenAI-compatible speech endpoint
      # (Kokoro-FastAPI on the show laptop). Blank = the tablets' own voices.
      LOOM_TTS_URL: ${LOOM_TTS_URL:-}
      LOOM_TTS_API_KEY: ${LOOM_TTS_API_KEY:-}
      LOOM_TTS_MODEL: ${LOOM_TTS_MODEL:-kokoro}
      LOOM_TTS_VOICE: ${LOOM_TTS_VOICE:-am_michael}
      # The reinstallation games + terminals share one house map
      # (docs/loom-reinstall.md §1.3). The image bakes in the show's
      # house.json; a director's save from /reinstall/map wins over it and
      # lives per event in the state volume as spatial-house.json
      # (/data/spatial-house.json for the default event,
      # /data/<eventId>/spatial-house.json for the rest). To pin another
      # default map, bind-mount it read-only outside /data (see the
      # commented volume below) and uncomment — never set it blank (an
      # empty path is not "unset"). The file is re-read when it changes.
      # LOOM_HOUSE: /config/house.json
      # Optional: pin the default event's passcodes (otherwise auto-generated
      # and printed in the logs + saved under the state volume):
      # LOOM_EVENT_PASS: ...
      # LOOM_MOD_PASS: ...
      # LOOM_PRIME_PASS: ...
    volumes:
      - loom-state:/data
      # With LOOM_HOUSE above: your own house map, read-only.
      # - ./house.json:/config/house.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    build:
      context: .
      target: proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      INVITE_ADDRESS: ${INVITE_ADDRESS:-:8081}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - loom

volumes:
  pgdata:
  loom-state:
  caddy-data:
  caddy-config:
