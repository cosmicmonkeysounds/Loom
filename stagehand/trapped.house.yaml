# (the map editor's 💡 Lights tab); this section only says where Zigbee2MQTT
# is. On Oct 31 it is ON in trapped.desktop.yaml (Zigbee2MQTT runs on the
# Desktop). Here it stays commented out, for a single bench Mac: uncomment
# it once Z2M runs there (scripts/house-macbook/zigbee.md), then
