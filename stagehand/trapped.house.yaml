# Trapped in the Internet — the house's show-control config (the house Mac).
# The story (core/examples/trapped-in-the-internet) only emits directives;
# this file makes them physical. Run it with:
#
#   uv run stagehand check --config trapped.house.yaml
#   uv run stagehand run   --config trapped.house.yaml --only show
#
# On the night it runs as its own launchd job, next to (never inside) the
# agents worker on the same Mac — restart one without touching the other,
# and never `pkill -f "stagehand run"`:
#
#   uv run stagehand launchd install --job show   --config trapped.house.yaml
#   uv run stagehand launchd install --job agents --config laptop.yaml
#   uv run stagehand launchd restart --job show   # logs: ~/Library/Logs/stagehand/
#
# (show.example.yaml stays the generic, test-pinned example; this is the
# real show. tests/test_trapped_house.py cross-checks it against the story.)
#
# THE RIG — one house Mac does it all: Mosquitto + Zigbee2MQTT, this file
#   (stagehand `show`), the agents worker + Ollama, QLab, the TV over the
#   long HDMI run and the speakers through the MOTU. It has a STATIC IP (a
#   DHCP reservation on the router, 192.168.8.10) that the server-room ESP32
#   firmware hard-codes (hardware/server-room/server_room/config.h).
#   Mosquitto runs two listeners: anonymous on 127.0.0.1:1883 for what runs
#   on this Mac (stagehand — `mqtt.host` below — Zigbee2MQTT, the alexa
#   player), and password-only on the LAN at :1884 (user `props`) for the
#   network props (the WLED controllers, the ESP32) —
#   scripts/house-mac/alexa.md → "Lock down the broker".
#   The story server is the VPS (https://app.mapsandducks.com); this machine
#   only dials out. If the house internet dies, fire the cues by hand
#   (QLab + the Z2M frontend scenes + WLED presets).
#
#   Z2M groups, one per lit room plus a whole-house group. The ids predate
#   the real house's room names (2026-10-15) and stay as wired:
#     house · living (The Desktop) · kitchen (The Start Bar) · backyard (The Cloud)
#     registry (The RAM, the basement studio) · tube (the halls + both stairs)
#     mudroom (The Optical Drive) · bathroom (Disk Cleanup: both bathrooms)
#     tent (The Internet) · server_room
#   The CPU, the Steam Room, the Fan Closet, the Graphics Card and the Hard
#   Drive have no group of their own: their bulbs join `house`.
#   SAFETY: the stairs, the bathrooms, the tent, the server room and the
#   server-room → living-room path are NOT in `house` (nor in any group a
#   darkening cue targets), so no `house` scene and no blackout can darken
#   them; give those bulbs `power_on_behavior: on`. `bathroom`, `tent` and
#   `server_room` exist for their own looks only; nothing here turns them off.
#   Scenes: `scene_store` each look ONCE while setting up — a whole-house look
#   on the `house` group itself, a room look on that room's group — with the
#   IDs in the table below, then the show only ever sends `scene_recall`.
#
#   WLED: the PAUTIX strips are addressable, on off-the-shelf WLED
#   controllers. Group topic `wled/all`, plus device topics wled/tube,
#   wled/living, wled/kitchen, wled/backyard, wled/registry, wled/server.
#   Build IDENTICAL preset IDs on every controller (same table). If one
#   controller drives several runs as segments, build each preset with the
#   segment looks it needs (e.g. ps 22 = the tube segment dim, the others off).
#   Preset 22 (tube_safe) lives on the tube controller: a dim, STATIC warm
#   white on the halls + stairs — what the blackout leaves lit.
#   QLab (or any OSC cue player) on this machine, UDP 53000: one cue per
#   `sound <name>`, its cue NUMBER = the name (e.g. cue "dance_song").
#
# RULES OF THUMB (docs/loom-show-control.md → the sensor map + retained topics;
# the house Mac runbook is scripts/house-mac/alexa.md)
#   - retain: false on every /set and /api command (a retained "OFF" survives
#     into tomorrow night). That is the default, so no rule sets it.
#   - Quote "on" inside WLED payloads: a bare `on:` key is YAML boolean true.
#   - Never stream flicker over Zigbee; use the bulb's own effect or WLED.
#
#  ID  cue                   Z2M (group → payload)               WLED
#   1  lights_screensaver    house  scene 1  dim cool blue drift  all ps 1
#   2  lights_tube_chase     —                                    tube ps 2 (chase toward the living room)
#   3  lights_call_desktop   house  scene 3  white, living bright all ps 3 (floor lines sweep to the Desktop)
#   4  lights_game           living scene 4  warm, bright         living ps 4
#   5  lights_truth_time     living scene 5  spot on fireplace    living ps 5
#   6  lights_ad_hijack      house  scene 6  garish magenta       all ps 6
#   7  lights_glitch         house  effect breathe (Hue + IKEA)   all ps 7 (Lightning / strobe)
#   8  lights_pong           backyard floods full                 backyard ps 8
#   9  lights_trust_chart    living scene 9  blue podium          living ps 9
#  10  lights_y2k            house  scene 10 amber, dim           all ps 10 (slow red pulse)
#  11  lights_server_open    server_room scene 11 dim green       server ps 11
#  12  lights_alarm          server_room red breathe + house 12   all ps 12 (red strobe)
#  13  lights_blackout       house  OFF, no transition            per device: living/kitchen/backyard/
#                                                                  registry off, tube ps 22, server untouched
#  14  lights_dance          house  scene 14 dance                all ps 14 (audio-reactive if fitted)
#  15  lights_final_reveal   house  scene 15 near dark            all ps 15 (embers)
#  16  lights_song           house  scene 16 pink, romantic       all ps 16
#  17  lights_rave           house  scene 17 colour loop          all ps 17 (strobe / rainbow)
#  18  lights_purgatory      house  scene 18 grey, dim            all ps 18
#  19  lights_banish         house  scene 19 red everywhere       all ps 19
#  20  lights_restore        house  scene 20 house normal         all ps 20
#  21  screens_flicker       house  effect blink (one-shot)       — (the strips are left alone: a WLED
#                                                                  playlist ends on a fixed preset, never
#                                                                  the look that was on; no ps 21)
#  22  (tube_safe)           —                                    tube ps 22 (dim static: the blackout's
#                                                                  stair light)
#
# Build ps 15 (final reveal) and ps 18 (purgatory) on the tube controller as
# a look that still lights the stair landing.
#
# SCREENS. The `screens_*` / `tv_*` / `terminals_*` / `tablet_*` cues have no
# rule here on purpose: the Screens layer (design §7 #13) consumes them from
# the mod feed directly, and the story mirrors each look into Night.screen /
# Night.terminals. Only `screens_flicker` is physical today: it blinks the
# house bulbs once (Hue / IKEA `effect: blink`, which reverts by itself) so
# Trabolta's power is felt, and never touches the strips or a mirror.

# The real event id + mod passcode never go in this tracked file: put them in
# trapped.house.local.yaml next to it (git-ignored, merged over `server:`) —
#   server: { event: <id>, mod_passcode: "<code>" }
# — or set LOOM_EVENT_ID / LOOM_MOD_PASSCODE. `stagehand check` flags a
# CHANGE-ME that nothing replaced.
server:
  url: https://app.mapsandducks.com
  event: CHANGE-ME-EVENT-ID  # the live event's id (Run → front of house / the /e/<id> URL)
  mod_passcode: "CHANGE-ME"  # or mod_token: "…"

show:
  mqtt:
    host: 127.0.0.1          # Mosquitto on this Mac (the props reach it on 192.168.8.10:1884)
    port: 1883
    client_id: stagehand-house

  osc:
    targets:
      qlab: { host: 127.0.0.1, port: 53000 }

  # --- story → house ----------------------------------------------------------
  cues:
    # ── Trabolta's `cut_the_lights` power and its restore (the long form) ──
    # <cue: lights, room: The Start Bar, state: off> — the story allow-lists
    # exactly these three rooms (cast/trabolta.loom; never The Cloud: the
    # outdoor steps + the tent path) and turns the room back on itself 90 s
    # later (<cue: lights, room: {Night.dark_room}, state: on>).
    # The Start Bar is the kitchen (knives, a stove): it only drops to ~20%,
    # never dark.
    - on: { directive: cue }
      match: { target: lights, room: The Start Bar, state: "off" }
      mqtt: { topic: "zigbee2mqtt/kitchen/set", payload: { state: "ON", brightness: 51, transition: 0 } }
    - on: { directive: cue }
      match: { target: lights, room: The Start Bar, state: "off" }
      # bri only: WLED keeps its on/off state, so the cut never lights a strip that was off.
      mqtt: { topic: "wled/kitchen/api", payload: { bri: 51 } }
    - on: { directive: cue }
      match: { target: lights, room: The Start Bar, state: "on" }
      mqtt: { topic: "zigbee2mqtt/kitchen/set", payload: { state: "ON", brightness: 254, transition: 1 } }
    - on: { directive: cue }
      match: { target: lights, room: The Start Bar, state: "on" }
      mqtt: { topic: "wled/kitchen/api", payload: { "on": true, bri: 255 } }

    - on: { directive: cue }
      match: { target: lights, room: The Desktop, state: "off" }
      mqtt: { topic: "zigbee2mqtt/living/set", payload: { state: "OFF", transition: 0 } }
    - on: { directive: cue }
      match: { target: lights, room: The Desktop, state: "off" }
      mqtt: { topic: "wled/living/api", payload: { "on": false } }
    - on: { directive: cue }
      match: { target: lights, room: The Desktop, state: "on" }
      mqtt: { topic: "zigbee2mqtt/living/set", payload: { state: "ON", transition: 1 } }
    - on: { directive: cue }
      match: { target: lights, room: The Desktop, state: "on" }
      mqtt: { topic: "wled/living/api", payload: { "on": true } }

    - on: { directive: cue }
      match: { target: lights, room: The RAM, state: "off" }
      mqtt: { topic: "zigbee2mqtt/registry/set", payload: { state: "OFF", transition: 0 } }
    - on: { directive: cue }
      match: { target: lights, room: The RAM, state: "off" }
      mqtt: { topic: "wled/registry/api", payload: { "on": false } }
    - on: { directive: cue }
      match: { target: lights, room: The RAM, state: "on" }
      mqtt: { topic: "zigbee2mqtt/registry/set", payload: { state: "ON", transition: 1 } }
    - on: { directive: cue }
      match: { target: lights, room: The RAM, state: "on" }
      mqtt: { topic: "wled/registry/api", payload: { "on": true } }

    # ── Scenes: one look per `cue lights_*` (IDs in the table above) ──
    - on: { directive: cue }
      match: { target: lights_screensaver }
      mqtt: { topic: "zigbee2mqtt/house/set", payload: { scene_recall: 1, transition: 3 } }
    - on: { directive: cue }
      match: { target: lights_screensaver }
      mqtt: { topic: "wled/all/api", payload: { "on": true, ps: 1 } }

    - on: { directive: cue }
      match: { target: lights_tube_chase }
      mqtt: { topic: "wled/tube/api", payload: { "on": true, ps: 2 } }

    - on: { directive: cue }
      match: { target: lights_call_desktop }
      mqtt: { topic: "zigbee2mqtt/house/set", payload: { scene_recall: 3, transition: 1 } }
    - on: { directive: cue }
      match: { target: lights_call_desktop }
      mqtt: { topic: "wled/all/api", payload: { "on": true, ps: 3 } }

    - on: { directive: cue }
      match: { target: lights_game }
      mqtt: { topic: "zigbee2mqtt/living/set", payload: { scene_recall: 4, transition: 2 } }
    - on: { directive: cue }
      match: { target: lights_game }
      mqtt: { topic: "wled/living/api", payload: { "on": true, ps: 4 } }

    - on: { directive: cue }
      match: { target: lights_truth_time }
      mqtt: { topic: "zigbee2mqtt/living/set", payload: { scene_recall: 5, transition: 1 } }
    - on: { directive: cue }
      match: { target: lights_truth_time }
      mqtt: { topic: "wled/living/api", payload: { "on": true, ps: 5 } }

    - on: { directive: cue }
      match: { target: lights_ad_hijack }
      mqtt: { topic: "zigbee2mqtt/house/set", payload: { scene_recall: 6, transition: 0 } }
    - on: { directive: cue }
      match: { target: lights_ad_hijack }
      mqtt: { topic: "wled/all/api", payload: { "on": true, ps: 6 } }

    - on: { directive: cue }
      match: { target: lights_glitch }
      mqtt: { topic: "zigbee2mqtt/house/set", payload: { effect: "breathe" } }
    - on: { directive: cue }
      match: { target: lights_glitch }
      mqtt: { topic: "wled/all/api", payload: { "on": true, ps: 7 } }

    - on: { directive: cue }
      match: { target: lights_pong }
      mqtt: { topic: "zigbee2mqtt/backyard/set", payload: { state: "ON", brightness: 254, transition: 2 } }
    - on: { directive: cue }
      match: { target: lights_pong }
      mqtt: { topic: "wled/backyard/api", payload: { "on": true, ps: 8 } }

    - on: { directive: cue }
      match: { target: lights_trust_chart }
      mqtt: { topic: "zigbee2mqtt/living/set", payload: { scene_recall: 9, transition: 1 } }
    - on: { directive: cue }
      match: { target: lights_trust_chart }
      mqtt: { topic: "wled/living/api", payload: { "on": true, ps: 9 } }

    - on: { directive: cue }
      match: { target: lights_y2k }
      mqtt: { topic: "zigbee2mqtt/house/set", payload: { scene_recall: 10, transition: 4 } }
    - on: { directive: cue }
      match: { target: lights_y2k }
      mqtt: { topic: "wled/all/api", payload: { "on": true, ps: 10 } }

    - on: { directive: cue }
      match: { target: lights_server_open }
      mqtt: { topic: "zigbee2mqtt/server_room/set", payload: { scene_recall: 11, transition: 2 } }
    - on: { directive: cue }
      match: { target: lights_server_open }
      mqtt: { topic: "wled/server/api", payload: { "on": true, ps: 11 } }
    - on: { directive: cue }
      match: { target: lights_server_open }
      mqtt: { topic: "show/serverroom/alarm", payload: { state: "off" } }

    - on: { directive: cue }
      match: { target: lights_alarm }
      mqtt: { topic: "zigbee2mqtt/server_room/set", payload: { state: "ON", brightness: 254, color: { hex: "#FF0000" }, effect: "breathe" } }
    - on: { directive: cue }
      match: { target: lights_alarm }
      mqtt: { topic: "zigbee2mqtt/house/set", payload: { scene_recall: 12, transition: 0 } }
    - on: { directive: cue }
      match: { target: lights_alarm }
      mqtt: { topic: "wled/all/api", payload: { "on": true, ps: 12 } }
    # The server-room ESP32's own siren + ring strobe, for the story's 120 s
    # alarm latch (it strobes locally even if the Wi-Fi drops mid-alarm). Since
    # wave 7 only the patch bay trips it (the second wrong combination); the
    # door never does.
    - on: { directive: cue }
      match: { target: lights_alarm }
      mqtt: { topic: "show/serverroom/alarm", payload: { state: "on", seconds: 120 } }

    # The blackout is 10 s in the story: it cues lights_dance itself
    # (Night.dance_at), so the off here needs no timer. `house` holds no
    # safety bulb (see THE RIG), and WLED goes off PER DEVICE: never
    # `wled/all`, so the tube strip (hall + stair landing) drops to its dim
    # static preset and the server-room strip (guests are in there) is left
    # alone.
    - on: { directive: cue }
      match: { target: lights_blackout }
      mqtt: { topic: "zigbee2mqtt/house/set", payload: { state: "OFF", transition: 0 } }
    - on: { directive: cue }
      match: { target: lights_blackout }
      mqtt: { topic: "wled/living/api", payload: { "on": false } }
    - on: { directive: cue }
      match: { target: lights_blackout }
      mqtt: { topic: "wled/kitchen/api", payload: { "on": false } }
    - on: { directive: cue }
      match: { target: lights_blackout }
      mqtt: { topic: "wled/backyard/api", payload: { "on": false } }
    - on: { directive: cue }
      match: { target: lights_blackout }
      mqtt: { topic: "wled/registry/api", payload: { "on": false } }
    - on: { directive: cue }
      match: { target: lights_blackout }
      mqtt: { topic: "wled/tube/api", payload: { "on": true, ps: 22 } }

    - on: { directive: cue }
      match: { target: lights_dance }
      mqtt: { topic: "zigbee2mqtt/house/set", payload: { scene_recall: 14, transition: 0 } }
    - on: { directive: cue }
      match: { target: lights_dance }
      mqtt: { topic: "wled/all/api", payload: { "on": true, ps: 14 } }

    - on: { directive: cue }
      match: { target: lights_final_reveal }
      mqtt: { topic: "zigbee2mqtt/house/set", payload: { scene_recall: 15, transition: 3 } }
    - on: { directive: cue }
      match: { target: lights_final_reveal }
      mqtt: { topic: "wled/all/api", payload: { "on": true, ps: 15 } }

    - on: { directive: cue }
      match: { target: lights_song }
      mqtt: { topic: "zigbee2mqtt/house/set", payload: { scene_recall: 16, transition: 3 } }
    - on: { directive: cue }
      match: { target: lights_song }
      mqtt: { topic: "wled/all/api", payload: { "on": true, ps: 16 } }

    - on: { directive: cue }
      match: { target: lights_rave }
      mqtt: { topic: "zigbee2mqtt/house/set", payload: { scene_recall: 17, transition: 0 } }
    - on: { directive: cue }
      match: { target: lights_rave }
      mqtt: { topic: "wled/all/api", payload: { "on": true, ps: 17 } }

    - on: { directive: cue }
      match: { target: lights_purgatory }
      mqtt: { topic: "zigbee2mqtt/house/set", payload: { scene_recall: 18, transition: 4 } }
    - on: { directive: cue }
      match: { target: lights_purgatory }
      mqtt: { topic: "wled/all/api", payload: { "on": true, ps: 18 } }

    - on: { directive: cue }
      match: { target: lights_banish }
      mqtt: { topic: "zigbee2mqtt/house/set", payload: { scene_recall: 19, transition: 0 } }
    - on: { directive: cue }
      match: { target: lights_banish }
      mqtt: { topic: "wled/all/api", payload: { "on": true, ps: 19 } }

    - on: { directive: cue }
      match: { target: lights_restore }
      mqtt: { topic: "zigbee2mqtt/house/set", payload: { scene_recall: 20, transition: 2 } }
    - on: { directive: cue }
      match: { target: lights_restore }
      mqtt: { topic: "wled/all/api", payload: { "on": true, ps: 20 } }
    - on: { directive: cue }
      match: { target: lights_restore }
      mqtt: { topic: "show/serverroom/alarm", payload: { state: "off" } }

    # ── Trabolta's flicker (and the story's involuntary ones): the screens
    # stutter (Screens layer) and the house bulbs blink once so it is felt.
    # The blink reverts by itself; the strips get nothing, since a WLED
    # preset would replace the look on them (at the beans, the glitch). ──
    - on: { directive: cue }
      match: { target: screens_flicker }
      mqtt: { topic: "zigbee2mqtt/house/set", payload: { effect: "blink" } }

    # ── Sound: `sound <name>` (directive sfx) → the QLab cue of that name ──
    # (no t_exec: QLab does not want the extra argument)
    - on: { directive: sfx }
      match: { target: modem_handshake }
      osc: { addr: "/cue/modem_handshake/start", to: qlab }
    - on: { directive: sfx }
      match: { target: announce_chime }
      # Not QLab: the announcement player owns the chime (K-20), so an
      # announcement and the story's `sound announce_chime` beside it ring
      # once, not twice.
      mqtt: { topic: "show/chime", payload: {} }
    - on: { directive: sfx }
      match: { target: bingo_start }
      osc: { addr: "/cue/bingo_start/start", to: qlab }
    - on: { directive: sfx }
      match: { target: ad_jingle }
      osc: { addr: "/cue/ad_jingle/start", to: qlab }
    - on: { directive: sfx }
      match: { target: truther_glitch }
      osc: { addr: "/cue/truther_glitch/start", to: qlab }
    - on: { directive: sfx }
      match: { target: countdown_tick }
      osc: { addr: "/cue/countdown_tick/start", to: qlab }
    - on: { directive: sfx }
      match: { target: printer_grind }
      osc: { addr: "/cue/printer_grind/start", to: qlab }
    - on: { directive: sfx }
      match: { target: beans_spill }
      osc: { addr: "/cue/beans_spill/start", to: qlab }
    - on: { directive: sfx }
      match: { target: zip }
      osc: { addr: "/cue/zip/start", to: qlab }
    - on: { directive: sfx }
      match: { target: y2k_chime }
      osc: { addr: "/cue/y2k_chime/start", to: qlab }
    - on: { directive: sfx }
      match: { target: alarm_siren }
      osc: { addr: "/cue/alarm_siren/start", to: qlab }
    - on: { directive: sfx }
      match: { target: windows_shutdown }
      osc: { addr: "/cue/windows_shutdown/start", to: qlab }
    # dance_song: the file opens with 10 s of silence (the blackout).
    - on: { directive: sfx }
      match: { target: dance_song }
      osc: { addr: "/cue/dance_song/start", to: qlab }
    - on: { directive: sfx }
      match: { target: motorcycle }
      osc: { addr: "/cue/motorcycle/start", to: qlab }
    - on: { directive: sfx }
      match: { target: youre_the_one_vocoder }
      osc: { addr: "/cue/youre_the_one_vocoder/start", to: qlab }
    - on: { directive: sfx }
      match: { target: youre_the_one_sandy_only }
      osc: { addr: "/cue/youre_the_one_sandy_only/start", to: qlab }
    - on: { directive: sfx }
      match: { target: rave }
      osc: { addr: "/cue/rave/start", to: qlab }
    - on: { directive: sfx }
      match: { target: hand_jive }
      osc: { addr: "/cue/hand_jive/start", to: qlab }
    # The awards ceremony (K-25): a bed under the whole ceremony, a fanfare
    # on every award. Assets: HW-AUD-15.
    - on: { directive: sfx }
      match: { target: ceremony_bed }
      osc: { addr: "/cue/ceremony_bed/start", to: qlab }
    - on: { directive: sfx }
      match: { target: award_fanfare }
      osc: { addr: "/cue/award_fanfare/start", to: qlab }

    # ── House announcements (the `alexa:` module): `do announce "…"` →
    # show/announce {"text": "…"} → the `alexa:` section below (same box)
    # plays it on the house speakers. A system voice, never a character. ──
    - on: { directive: announce }
      mqtt: { topic: "show/announce", payload: { text: "{target}" } }
    # …and the music ducks under it (SW-AUD-05): the cue map fires EVERY
    # matching rule, so this second rule rides the same `do announce`. QLab's
    # `duck_music` group cue (non-code, the tech op builds it) fades the bed /
    # background group only (never dance_song, rave or hand_jive) −12 dB over
    # 0.3 s, holds ≈ 7 s (the chime + the longest line), fades back over 1 s.
    - on: { directive: announce }
      osc: { addr: "/cue/duck_music/start", to: qlab }

    # ── The server-room door INDICATOR. The door has a STANDALONE keypad lock
    # (code set by hand on the lock, never networked; egress is mechanical:
    # the inside handle always opens). Nothing here can lock or unlock it,
    # and no rule may ever drive a lock, strike or relay on that door.
    # `do door server_room, state: locked|unlocked` drives ONLY the ESP32's
    # ring: red breathing = locked, green = unlocked. The story sends
    # `locked` at Power On (true: the real door is locked) and nothing sends
    # `unlocked` since wave 7; the rule stays for the bench. The one retained
    # command here — it is an indicator, so a rebooted ESP32 re-converges on
    # it, and the story re-sends `locked` on every boot. ──
    - on: { directive: door }
      match: { target: server_room, state: unlocked }
      mqtt: { topic: "show/serverroom/lock", payload: { state: unlocked }, retain: true }
    - on: { directive: door }
      match: { target: server_room, state: locked }
      mqtt: { topic: "show/serverroom/lock", payload: { state: locked }, retain: true }

  # --- catch-up (SW-SH-10) ----------------------------------------------------
  # On every (re)connect of the mod feed, and 1.5 s after a story restart
  # (reset / reload / golive), stagehand reads the story's light mirrors from
  # GET /api/state and replays them through the rules above, in order: the
  # scene, then Trabolta's dark room on top while his 90 s cut is still on,
  # or lit again once it is over (a lost restore never leaves it dark).
  # A cue fired while the uplink or the broker was down is no longer lost. `alarm` is never
  # replayed: it would re-arm the server room's 120 s siren. The director's
  # re-fire of the current lights cue (OP-16) stays the fallback.
  # `server_open` (the majority, The Heart) is the server room's look on
  # top of the Y2K house look — lights_server_open touches that room alone —
  # and is only ever set before the final reveal, on lights_y2k. So it
  # replays the house layer first, the way the story's own alarm restore
  # does (`lights_y2k` then `lights_server_open`).
  catch_up:
    - path: Night.lights
      cue: "lights_y2k"
      when: "Night.lights == 'server_open'"
    - path: Night.lights
      cue: "lights_{value}"
      skip: [alarm]
    # The mid-cut rule uses the story's own test for "the look on now never
    # re-lit the cut room" (main.loom's `Night.lights_back_at` rule, wave 9
    # T8-stagehand-01): the look he cut, a room-scoped look (pong = the
    # backyard, glitch = an effect, server_open = the server room over the
    # Y2K house), or a living-room look (game / truth_time / trust_chart)
    # over any cut but The Desktop's. A whole-house look since re-lit it.
    # The restore rule replays under the look the story restored into, or a
    # later look that never re-lit the room (the same test).
    - path: Night.dark_room
      cue: "lights, room: {value}, state: off"
      skip: [none]
      # Night.dark_room is never cleared: replay it only mid-cut, under a look that kept it dark.
      when: "Night.lights_back_at > 0 && (Night.lights == Night.dark_scene || Night.lights == 'pong' || Night.lights == 'glitch' || Night.lights == 'server_open' || ((Night.lights == 'game' || Night.lights == 'truth_time' || Night.lights == 'trust_chart') && Night.dark_room != 'The Desktop'))"
    - path: Night.dark_room
      cue: "lights, room: {value}, state: on"
      skip: [none]
      # The cut is over (the story zeroed lights_back_at) and its 90 s restore
      # turned the room back on: the story records the look it did that under
      # as Night.lit_scene ("none" when the restore was skipped, at a later
      # look that re-lit the room, at the alarm latch's end, at 💡 / G11 and
      # at Power On). Replay it under that look or a later room-scoped one,
      # so a restore lost under pong still lands under the Trust Chart, and
      # never under a whole-house look: a long-finished cut never punches the
      # room to full (T8 recheck).
      when: "Night.lights_back_at == 0 && Night.lit_scene != 'none' && (Night.lights == Night.lit_scene || Night.lights == 'pong' || Night.lights == 'glitch' || Night.lights == 'server_open' || ((Night.lights == 'game' || Night.lights == 'truth_time' || Night.lights == 'trust_chart') && Night.dark_room != 'The Desktop'))"

  # --- house → story ----------------------------------------------------------
  # Every name here must be a `when <name>` story rule in main.loom: stagehand
  # never validates signal names, so a typo is silent (the test checks it).
  # Retained messages never fire a rule (the broker replays them on every
  # reconnect); on an `edge: true` rule they only prime the level, so a
  # stagehand restart with the door propped open fires nothing.
  sensors:
    # Server-room door, PRIMARY: the wire-loop contact on the server-room
    # ESP32 (GPIO19), two loops that TOUCH when the door is OPEN (`DOOR_TAPE`,
    # closed-when-open; a reed is optional). Firmware publishes
    # {"open": bool, "tape": bool, "mode": "tape"} on change, RETAINED (so a
    # restart primes). The contact is direction-blind: an entry with the
    # keypad code and an exit by the inside handle each fire once; a propped
    # door fires once. The story starts the server-room cutscene on the first
    # opening and latches it, and the door never raises an alarm. 20 s of
    # debounce makes a group filing through (open, shut, open) one opening.
    - on: { topic: "sensors/serverroom/door", when: "open == true" }
      edge: true
      signal: { name: server_door_opened, debounce_s: 20 }
    # …and the optional Zigbee contact on the same door (contact false =
    # OPEN). Z2M republishes the state on every battery report — the edge
    # makes that one fire per real opening; set `retain: true` on this device
    # in Z2M so a restart primes too. The story's cutscene latch makes a
    # double fire (both sensors on one opening) harmless.
    - on: { topic: "zigbee2mqtt/server_room_door", when: "contact == false" }
      edge: true
      signal: { name: server_door_opened, debounce_s: 20 }

    # The printer: a Zigbee button over its START key, a reed switch on the lid.
    - on: { topic: "zigbee2mqtt/printer_button", when: "action == 'single'" }
      signal: { name: printer_button_pressed, debounce_s: 3 }
    - on: { topic: "zigbee2mqtt/printer_lid", when: "contact == false" }
      edge: true
      signal: { name: printer_opened, debounce_s: 30 }

    # The patch bay (Trabolta's heart): the scanner publishes the canonical,
    # V-sorted pairs once stable, e.g.
    #   sensors/patchbay/state {"combo": "V2-D5,V4-D1,V6-D8,V7-D3", "complete": true}
    # Stagehand judges until signal args exist (§7 #20). These two strings MUST
    # equal the Kernel.combo_a / Kernel.combo_b seeds in main.loom and the
    # four combo-half codex entries (codex/4-trabolta.loom).
    # Each combo fires once per time it is made (edge), however often the
    # scanner republishes it.
    - on: { topic: "sensors/patchbay/state", when: "complete == true && combo == 'V2-D5,V4-D1,V6-D8,V7-D3'" }
      edge: true
      signal: { name: patch_combo_a, debounce_s: 60 }
    - on: { topic: "sensors/patchbay/state", when: "complete == true && combo == 'V1-D6,V3-D2,V5-D7,V8-D4'" }
      edge: true
      signal: { name: patch_combo_b, debounce_s: 60 }
    - on: { topic: "sensors/patchbay/state", when: "complete == true && combo != 'V2-D5,V4-D1,V6-D8,V7-D3' && combo != 'V1-D6,V3-D2,V5-D7,V8-D4'" }
      signal: { name: patch_rejected, debounce_s: 10 }

# --- the house announcement player (K-20; module key `alexa:` kept for now, a cleanup) ---
# Runs on this same house Mac as its own launchd job (`--only alexa`, see
# scripts/house-mac/alexa.md) so a show restart never cuts an announcement.
# show/announce → chime + the Mac's own `say` voice → the MOTU, Z1 + Z2 (no
# server round-trip; works with the house internet down). Falls back to
# `say -a` on the device, then the default output. Wall terminals provisioned
# with `&announce=1` say the same line in their own voice (N-09).
# Find the device's exact name with `uv run python -m sounddevice`.
alexa:
  mqtt:
    host: 127.0.0.1
    port: 1883
    client_id: stagehand-alexa
  topic: show/announce
  chime_topic: show/chime    # `sound announce_chime` (merged into a fresh announcement)
  device: "MOTU"             # a substring of the interface's CoreAudio name
  channels: [1, 2, 3, 4]     # Z1 living (1/2) + Z2 kitchen (3/4) — B-4
  engine: say                # the Mac's own voice (decision 2026-10-15)
  say_voice: Samantha        # `say -v '?'` lists them; an Enhanced/Premium one is nicer
  chime: synth               # or a file: chime: media/announce_chime.wav
  gain_db: 0
  # engine: server only (the VPS's opt-in Kokoro, COMPOSE_PROFILES=tts):
  voice: af_sky              # Kokoro, via the event server's /api/mod/tts
  tts_timeout: 4
  # Every `do announce "…"` line in the story (tests/test_trapped_house.py
  # keeps this in step) — with `engine: server`, fetched once at boot and
  # kept on disk, so the scripted lines play instantly and survive the house
  # internet dying. Unused with `engine: say`.
  prewarm:
    - "All programs, report to the Desktop. A game is about to begin."
    - "Five minutes. Everyone to the Desktop."
    - "Go to the living room."
    - "Time is up. Return to the Desktop."

# --- the house speaker router (wave 17; module `audio:`, OFF until switched on) ---
# The speakers, zones, the MOTU's input→output matrix and where every
# `sound X` goes live in the event's audio.json (the map editor's Audio
# panel). This section only says what the router may do on this Mac. Its
# own launchd job: `uv run stagehand launchd install --job audio --config
# trapped.house.yaml`. Keep it in THIS file: the show job reads it.
#   1. Uncomment with both switches false: the router only runs the matrix
#      (audio.json routes) and the map editor's speaker Test buttons.
#   2. play_sounds: true — the router plays every `sound X` from sounds_dir
#      and the QLab sound cues above are skipped (restart the show job too).
#   3. announce: true — the router plays `do announce` on audio.json
#      `announce.to`; DELETE the `alexa:` section first (one owner of the
#      house's voice) and stop its launchd agent.
# audio:
#   sounds_dir: media/sounds     # <sound name>.wav | .aiff | .flac
#   play_sounds: false
#   announce: false
#   passthrough: true            # false = output-only (no microphone permission)
#   mqtt: { host: 127.0.0.1, port: 1883, client_id: stagehand-audio }
#   say_voice: Samantha
#   chime: synth
