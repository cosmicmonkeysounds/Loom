# Trapped in the Internet — the house's show-control config (the shared base).
# The story (core/examples/trapped-in-the-internet) only emits directives;
# this file makes them physical. Every show rule, sensor, catch-up and the
# speaker router's settings live here once; each machine runs a small file
# that `extends:` it and says what differs there:
#
#   trapped.desktop.yaml   John's Desktop (Windows): the `show`, `lights` and
#                          `audio` jobs, beside Mosquitto, Zigbee2MQTT, the
#                          MOTU 828x and the TV (Task Scheduler: `stagehand
#                          tasks install --job …`; scripts/house-desktop/README.md)
#   trapped.macbook.yaml   John's MacBook (macOS), only in the router
#                          FALLBACK: the `audio` router and the MOTU, dialling
#                          the Desktop's broker on :1884 (launchd;
#                          scripts/house-macbook/audio.md). The MacBook's
#                          normal job is Trabolta's `agents` worker
#                          (laptop.yaml; scripts/house-macbook/trabolta.md).
#
#   uv run stagehand check --config trapped.desktop.yaml --only show,lights,audio   # on the Desktop
#   uv run stagehand check --config trapped.macbook.yaml --only audio               # the MacBook fallback
#
# Run this file directly only on a single bench machine. Always pass --only:
# one machine must never run two copies of the same job (two `show` jobs fire
# every cue twice; two routers speak every announcement twice), and never
# `pkill -f "stagehand run"` (it kills every job on that machine).
#
# (show.example.yaml stays the generic, test-pinned example; this is the
# real show. tests/test_trapped_house.py cross-checks it against the story,
# tests/test_machine_configs.py the two machine files.)
#
# THE RIG (Oct 31)
#   John's Desktop has the house's STATIC IP (a DHCP reservation on the
#   router, 192.168.8.10; it was the old single house Mac's). It runs
#   Mosquitto with two listeners: anonymous on 127.0.0.1:1883 for what runs
#   on the Desktop itself (the `show` job — `mqtt.host` below — Zigbee2MQTT,
#   the `lights` job) and password-only on the LAN at :1884 (user `props`)
#   for everything else (the WLED controllers, the MacBook's router in the
#   fallback) —
#   scripts/house-desktop/setup-mosquitto.ps1.
#   `do announce` reaches the speakers only as show/announce from the
#   Desktop's `show` job on that broker; the router is on the Desktop too
#   (story sounds don't need the broker: the router reads the server's feed).
#   Sound is the router on the MOTU 828x's own outs (wave 31: no ADAT
#   expander; Analog 1-8, Main L/R, Phones L/R; no QLab, no alexa player).
#   The MacBook is the router's fallback (trapped.macbook.yaml).
#   The server room has no stagehand device: its door sensor and patch bay
#   are on the Grand Central M4 beside Steph's laptop, whose terminal page
#   posts door_sensor_opened / door_sensor_closed and patch_changed {combo}
#   to the story itself (wave 22, hardware/server-room-m4/). The ESP32 box
#   (hardware/server-room/) is NOT INSTALLED (Q7, 2026-10-23); its
#   show/serverroom/* publishes and sensors/patchbay/state rules below stay
#   for a bench, publish to nobody and never fire; the siren is the router's
#   alarm_siren, and the Antivirus watch's 🔌 💥 ❌ (radio_*) are the patch
#   bay's fallback.
#   The story server is the VPS (https://app.mapsandducks.com); the house
#   only dials out. If the house internet dies, fire the cues by hand: the
#   sounds with `uv run stagehand sounds play <name> --config
#   trapped.desktop.yaml` on the Desktop (or `mosquitto_pub -t show/audio/play -m
#   '{"name":"<name>"}'` on the Desktop), the stop with `stagehand sounds
#   stop`, the lights from the Zigbee2MQTT frontend.
#
#   THE LIGHTS (wave 31, 2026-10-27). Every bulb is a fixture in the show's
#   lights.json (core/examples/trapped-in-the-internet/), played by the
#   Desktop's `lights` job — not by this file. The story's `cue lights_*`
#   are lights.json LOOKS (designed in Run → House → Cue designer); there
#   are no Zigbee scenes, no Zigbee groups and no WLED presets any more.
#   Bulbs (Philips Hue + ThirdReality ZL1 on the CC2652P; Zigbee2MQTT
#   friendly names = lights.json `device`):
#     living_1..3 (The Desktop) · kitchen_1..3 (The Start Bar) · casino
#     (The Graphics Card) · fan_closet_1..2 · ram_1..3 (The RAM, the studio)
#     SAFETY (never off, never below 60 / 254; power_on_behavior: on):
#     hall_main · hall_up · hall_basement · bath_down · bath_up
#     server_room_rgb: the server room's only light, Trabolta's heart_* looks
#     (safety, never below 80).
#   The living room's RGB strip is a WLED controller (ESP32) on Wi-Fi,
#   MQTT device topic `wled/living` on the Desktop's broker (:1884).
#   This file keeps only what a look can't say: Trabolta's room cuts
#   (`<cue: lights, room: X, state: off|on>`) and `screens_flicker` (the
#   bulbs' own one-shot blink), addressed bulb by bulb (no group to set up),
#   and the ESP32's alarm publishes (not installed). The lights module
#   catches up the house look (Night.lights) and the heart look itself.
#
# RULES OF THUMB (docs/loom-show-control.md → the sensor map + retained topics;
# the runbooks are scripts/house-desktop/README.md and scripts/house-macbook/)
#   - retain: false on every /set and /api command (a retained "OFF" survives
#     into tomorrow night). That is the default, so no rule sets it.
#   - Quote "on" inside WLED payloads: a bare `on:` key is YAML boolean true.
#   - Never stream flicker over Zigbee; use the bulb's own effect or WLED.
#   - Nothing here ever addresses a safety bulb or server_room_rgb.
#
# SCREENS. The `screens_*` / `tv_*` / `terminals_*` / `tablet_*` cues have no
# rule here on purpose: the Screens layer (design §7 #13) consumes them from
# the mod feed directly, and the story mirrors each look into Night.screen /
# Night.terminals. Only `screens_flicker` is physical today: it blinks the
# house bulbs once (Hue / IKEA `effect: blink`, which reverts by itself) so
# Trabolta's power is felt, and never touches the strips or a mirror.

# The real event id + mod passcode never go in this tracked file: put them in
# trapped.house.local.yaml next to it (git-ignored, merged over `server:`) —
#   server: { event: <id>, mod_passcode: "<code>" }
# — or set LOOM_EVENT_ID / LOOM_MOD_PASSCODE. `stagehand check` flags a
# CHANGE-ME that nothing replaced.
server:
  url: https://app.mapsandducks.com
  event: CHANGE-ME-EVENT-ID  # the live event's id (Run → front of house / the /e/<id> URL)
  mod_passcode: "CHANGE-ME"  # or mod_token: "…"

show:
  mqtt:
    host: 127.0.0.1          # Mosquitto on the same machine (the Desktop; the props reach it on 192.168.8.10:1884)
    port: 1883
    client_id: stagehand-house

  # --- story → house ----------------------------------------------------------
  cues:
    # ── Trabolta's `cut_the_lights` power and its restore (the long form) ──
    # <cue: lights, room: The Start Bar, state: off> — the story allow-lists
    # exactly these three rooms (cast/trabolta.loom; never The Cloud: the
    # outdoor steps + the tent path) and turns the room back on itself 90 s
    # later (<cue: lights, room: {Night.dark_room}, state: on>). Bulb by bulb
    # (lights.json's `device` names): no Zigbee group to set up. A later
    # house look re-lights the room anyway.
    # The Start Bar is the kitchen (knives, a stove): it only drops to ~20%,
    # never dark.
    - on: { directive: cue }
      match: { target: lights, room: The Start Bar, state: "off" }
      mqtt: { topic: "zigbee2mqtt/kitchen_1/set", payload: { state: "ON", brightness: 51, transition: 0 } }
    - on: { directive: cue }
      match: { target: lights, room: The Start Bar, state: "off" }
      mqtt: { topic: "zigbee2mqtt/kitchen_2/set", payload: { state: "ON", brightness: 51, transition: 0 } }
    - on: { directive: cue }
      match: { target: lights, room: The Start Bar, state: "off" }
      mqtt: { topic: "zigbee2mqtt/kitchen_3/set", payload: { state: "ON", brightness: 51, transition: 0 } }
    - on: { directive: cue }
      match: { target: lights, room: The Start Bar, state: "on" }
      mqtt: { topic: "zigbee2mqtt/kitchen_1/set", payload: { state: "ON", brightness: 254, transition: 1 } }
    - on: { directive: cue }
      match: { target: lights, room: The Start Bar, state: "on" }
      mqtt: { topic: "zigbee2mqtt/kitchen_2/set", payload: { state: "ON", brightness: 254, transition: 1 } }
    - on: { directive: cue }
      match: { target: lights, room: The Start Bar, state: "on" }
      mqtt: { topic: "zigbee2mqtt/kitchen_3/set", payload: { state: "ON", brightness: 254, transition: 1 } }

    - on: { directive: cue }
      match: { target: lights, room: The Desktop, state: "off" }
      mqtt: { topic: "zigbee2mqtt/living_1/set", payload: { state: "OFF", transition: 0 } }
    - on: { directive: cue }
      match: { target: lights, room: The Desktop, state: "off" }
      mqtt: { topic: "zigbee2mqtt/living_2/set", payload: { state: "OFF", transition: 0 } }
    - on: { directive: cue }
      match: { target: lights, room: The Desktop, state: "off" }
      mqtt: { topic: "zigbee2mqtt/living_3/set", payload: { state: "OFF", transition: 0 } }
    - on: { directive: cue }
      match: { target: lights, room: The Desktop, state: "off" }
      mqtt: { topic: "wled/living/api", payload: { "on": false } }
    - on: { directive: cue }
      match: { target: lights, room: The Desktop, state: "on" }
      mqtt: { topic: "zigbee2mqtt/living_1/set", payload: { state: "ON", transition: 1 } }
    - on: { directive: cue }
      match: { target: lights, room: The Desktop, state: "on" }
      mqtt: { topic: "zigbee2mqtt/living_2/set", payload: { state: "ON", transition: 1 } }
    - on: { directive: cue }
      match: { target: lights, room: The Desktop, state: "on" }
      mqtt: { topic: "zigbee2mqtt/living_3/set", payload: { state: "ON", transition: 1 } }
    - on: { directive: cue }
      match: { target: lights, room: The Desktop, state: "on" }
      mqtt: { topic: "wled/living/api", payload: { "on": true } }

    - on: { directive: cue }
      match: { target: lights, room: The RAM, state: "off" }
      mqtt: { topic: "zigbee2mqtt/ram_1/set", payload: { state: "OFF", transition: 0 } }
    - on: { directive: cue }
      match: { target: lights, room: The RAM, state: "off" }
      mqtt: { topic: "zigbee2mqtt/ram_2/set", payload: { state: "OFF", transition: 0 } }
    - on: { directive: cue }
      match: { target: lights, room: The RAM, state: "off" }
      mqtt: { topic: "zigbee2mqtt/ram_3/set", payload: { state: "OFF", transition: 0 } }
    - on: { directive: cue }
      match: { target: lights, room: The RAM, state: "on" }
      mqtt: { topic: "zigbee2mqtt/ram_1/set", payload: { state: "ON", transition: 1 } }
    - on: { directive: cue }
      match: { target: lights, room: The RAM, state: "on" }
      mqtt: { topic: "zigbee2mqtt/ram_2/set", payload: { state: "ON", transition: 1 } }
    - on: { directive: cue }
      match: { target: lights, room: The RAM, state: "on" }
      mqtt: { topic: "zigbee2mqtt/ram_3/set", payload: { state: "ON", transition: 1 } }
    # ── The `lights_*` looks are lights.json's (the `lights` job). Only the
    # server-room ESP32's alarm (NOT INSTALLED: these publish to nobody) is
    # here: on for the story's 120 s alarm latch, off when the room opens
    # or the house is restored. ──
    - on: { directive: cue }
      match: { target: lights_alarm }
      mqtt: { topic: "show/serverroom/alarm", payload: { state: "on", seconds: 120 } }
    - on: { directive: cue }
      match: { target: lights_server_open }
      mqtt: { topic: "show/serverroom/alarm", payload: { state: "off" } }
    - on: { directive: cue }
      match: { target: lights_restore }
      mqtt: { topic: "show/serverroom/alarm", payload: { state: "off" } }

    # ── Trabolta's flicker (and the story's involuntary ones): the screens
    # stutter (Screens layer) and every room bulb blinks once so it is felt
    # (the bulbs' own `effect: blink`, which reverts by itself). Never the
    # halls, the bathrooms or the server room; the strip is left alone. ──
    - on: { directive: cue }
      match: { target: screens_flicker }
      mqtt: { topic: "zigbee2mqtt/living_1/set", payload: { effect: "blink" } }
    - on: { directive: cue }
      match: { target: screens_flicker }
      mqtt: { topic: "zigbee2mqtt/living_2/set", payload: { effect: "blink" } }
    - on: { directive: cue }
      match: { target: screens_flicker }
      mqtt: { topic: "zigbee2mqtt/living_3/set", payload: { effect: "blink" } }
    - on: { directive: cue }
      match: { target: screens_flicker }
      mqtt: { topic: "zigbee2mqtt/kitchen_1/set", payload: { effect: "blink" } }
    - on: { directive: cue }
      match: { target: screens_flicker }
      mqtt: { topic: "zigbee2mqtt/kitchen_2/set", payload: { effect: "blink" } }
    - on: { directive: cue }
      match: { target: screens_flicker }
      mqtt: { topic: "zigbee2mqtt/kitchen_3/set", payload: { effect: "blink" } }
    - on: { directive: cue }
      match: { target: screens_flicker }
      mqtt: { topic: "zigbee2mqtt/casino/set", payload: { effect: "blink" } }
    - on: { directive: cue }
      match: { target: screens_flicker }
      mqtt: { topic: "zigbee2mqtt/fan_closet_1/set", payload: { effect: "blink" } }
    - on: { directive: cue }
      match: { target: screens_flicker }
      mqtt: { topic: "zigbee2mqtt/fan_closet_2/set", payload: { effect: "blink" } }
    - on: { directive: cue }
      match: { target: screens_flicker }
      mqtt: { topic: "zigbee2mqtt/ram_1/set", payload: { effect: "blink" } }
    - on: { directive: cue }
      match: { target: screens_flicker }
      mqtt: { topic: "zigbee2mqtt/ram_2/set", payload: { effect: "blink" } }
    - on: { directive: cue }
      match: { target: screens_flicker }
      mqtt: { topic: "zigbee2mqtt/ram_3/set", payload: { effect: "blink" } }

    # ── Sound: every `sound <name>` (directive sfx) is the `audio:` router's
    # (play_sounds: true, below) — it plays media/sounds/<name>.wav on the
    # audio.json cue's speakers, so no rule here. The one exception is the
    # chime: the router rings it with the announcements (merged into a fresh
    # one, K-20) and hears the story's `sound announce_chime` on show/chime,
    # so an announcement and the chime beside it ring once, not twice. ──
    - on: { directive: sfx }
      match: { target: announce_chime }
      mqtt: { topic: "show/chime", payload: {} }

    # ── House announcements: `do announce "…"` → show/announce {"text": "…"}
    # → the `audio:` router (announce: true, below) rings the chime and says
    # it in the router machine's own voice (macOS `say` / Windows SAPI) on audio.json `announce.to`, ducking
    # the story's sounds under it (never dance_song, rave or hand_jive).
    # A system voice, never a character. The router takes announcements only
    # from MQTT while it has a broker, so this rule is the one path. ──
    - on: { directive: announce }
      mqtt: { topic: "show/announce", payload: { text: "{target}" } }

    # ── The server-room door INDICATOR. The door has a STANDALONE keypad lock
    # (code set by hand on the lock, never networked; egress is mechanical:
    # the inside handle always opens). Nothing here can lock or unlock it,
    # and no rule may ever drive a lock, strike or relay on that door.
    # `do door server_room, state: locked|unlocked` drives ONLY the ESP32's
    # ring: red breathing = locked, green = unlocked. ESP32 (not installed
    # for Oct 31, Q7): the retained `locked` waits on the broker for nobody. The story sends
    # `locked` at Power On (true: the real door is locked) and nothing sends
    # `unlocked` since wave 7; the rule stays for the bench. The one retained
    # command here — it is an indicator, so a rebooted ESP32 re-converges on
    # it, and the story re-sends `locked` on every boot. ──
    - on: { directive: door }
      match: { target: server_room, state: unlocked }
      mqtt: { topic: "show/serverroom/lock", payload: { state: unlocked }, retain: true }
    - on: { directive: door }
      match: { target: server_room, state: locked }
      mqtt: { topic: "show/serverroom/lock", payload: { state: locked }, retain: true }

  # --- catch-up (SW-SH-10) ----------------------------------------------------
  # On every (re)connect of the mod feed, and 1.5 s after a story restart
  # (reset / reload / golive), stagehand reads the story's light mirrors from
  # GET /api/state and replays Trabolta's dark room through the rules above
  # while his 90 s cut is still on, or lit again once it is over (a lost
  # restore never leaves it dark). Since wave 31 the house look itself
  # (`lights_{Night.lights}`) is the `lights` job's: it catches it up from
  # the screen state's `night.lights` (and the heart look on top).
  catch_up:
    # The mid-cut rule uses the story's own test for "the look on now never
    # re-lit the cut room" (main.loom's `Night.lights_back_at` rule, wave 9
    # T8-stagehand-01): the look he cut, a room-scoped look (pong = the
    # backyard, glitch = an effect, server_open = the server room over the
    # Y2K house), or a living-room look (game / truth_time / trust_chart)
    # over any cut but The Desktop's. A whole-house look since re-lit it.
    # The restore rule replays under the look the story restored into, or a
    # later look that never re-lit the room (the same test).
    - path: Night.dark_room
      cue: "lights, room: {value}, state: off"
      skip: [none]
      # Night.dark_room is never cleared: replay it only mid-cut, under a look that kept it dark.
      when: "Night.lights_back_at > 0 && (Night.lights == Night.dark_scene || Night.lights == 'pong' || Night.lights == 'glitch' || Night.lights == 'server_open' || ((Night.lights == 'game' || Night.lights == 'truth_time' || Night.lights == 'trust_chart') && Night.dark_room != 'The Desktop'))"
    - path: Night.dark_room
      cue: "lights, room: {value}, state: on"
      skip: [none]
      # The cut is over (the story zeroed lights_back_at) and its 90 s restore
      # turned the room back on: the story records the look it did that under
      # as Night.lit_scene ("none" when the restore was skipped, at a later
      # look that re-lit the room, at the alarm latch's end, at 💡 / G11 and
      # at Power On). Replay it under that look or a later room-scoped one,
      # so a restore lost under pong still lands under the Trust Chart, and
      # never under a whole-house look: a long-finished cut never punches the
      # room to full (T8 recheck).
      when: "Night.lights_back_at == 0 && Night.lit_scene != 'none' && (Night.lights == Night.lit_scene || Night.lights == 'pong' || Night.lights == 'glitch' || Night.lights == 'server_open' || ((Night.lights == 'game' || Night.lights == 'truth_time' || Night.lights == 'trust_chart') && Night.dark_room != 'The Desktop'))"

  # --- house → story ----------------------------------------------------------
  # Every name here must be a `when <name>` story rule in main.loom: stagehand
  # never validates signal names, so a typo is silent (the test checks it).
  # Retained messages never fire a rule (the broker replays them on every
  # reconnect); on an `edge: true` rule they only prime the level, so a
  # stagehand restart with the door propped open fires nothing.
  sensors:
    # The server-room DOOR is not read here any more (wave 20, D16): an LDR +
    # LED on the frame feeds the Grand Central M4 beside his heart's terminal,
    # and that terminal page posts door_sensor_opened / door_sensor_closed to
    # the story itself (hardware/server-room-m4/). The ESP32's wire-loop
    # contact and the optional Zigbee contact (`server_room_door`) are
    # unread: a stagehand rule here would post server_door_opened, which is a
    # director's 🚪 override in the story (D19) and would take the door off
    # the sensor for the night.

    # The printer: a Zigbee button over its START key, a reed switch on the lid.
    - on: { topic: "zigbee2mqtt/printer_button", when: "action == 'single'" }
      signal: { name: printer_button_pressed, debounce_s: 3 }
    - on: { topic: "zigbee2mqtt/printer_lid", when: "contact == false" }
      edge: true
      signal: { name: printer_opened, debounce_s: 30 }

    # ESP32 legacy (not installed for Oct 31, Q7): nothing publishes this
    # topic, so these three never fire. Since wave 22 the patch bay is on the
    # Grand Central M4 beside the door sensor: the server-room terminal reads
    # it over Web Serial and posts `patch_changed {combo}` itself, and the
    # story judges it (main.loom E3); the watch's 🔌 💥 ❌ (radio_*) are its
    # fallback. Kept for a show with the ESP32 scanner fitted. The scanner
    # publishes the canonical, V-sorted pairs once stable, e.g.
    #   sensors/patchbay/state {"combo": "V1-Dx,V3-Dy,…", "complete": true}
    # Stagehand's signal rules carry no arguments, so here stagehand judges
    # and fires the admin cues patch_combo_* / patch_rejected: to the story
    # those are button presses, which put the bay on the buttons
    # (Night.patch_override). These two strings MUST equal the Kernel.combo_a
    # / Kernel.combo_b seeds in main.loom and the four combo-half codex
    # entries (codex/4-trabolta.loom).
    # Each combo fires once per time it is made (edge), however often the
    # scanner republishes it.
    - on: { topic: "sensors/patchbay/state", when: "complete == true && combo == 'V1-D4,V2-D3,V3-D1,V4-D2'" }
      edge: true
      signal: { name: patch_combo_a, debounce_s: 60 }
    - on: { topic: "sensors/patchbay/state", when: "complete == true && combo == 'V1-D3,V2-D4,V3-D2,V4-D1'" }
      edge: true
      signal: { name: patch_combo_b, debounce_s: 60 }
    - on: { topic: "sensors/patchbay/state", when: "complete == true && combo != 'V1-D4,V2-D3,V3-D1,V4-D2' && combo != 'V1-D3,V2-D4,V3-D2,V4-D1'" }
      signal: { name: patch_rejected, debounce_s: 10 }

# --- the house speaker router (wave 18b: every story sound AND the house announcements) ---
# The speakers, zones, the 828x's channels and where every `sound X` goes
# live in the event's audio.json (the map editor's Audio tab); this section
# only says what the router may do. It runs as its own job on ONE machine,
# by default the MacBook (keep the section in THIS file: the show job reads
# `play_sounds`; trapped.macbook.yaml overrides only its mqtt):
#   uv run stagehand launchd install --job audio --config trapped.macbook.yaml
# The `alexa` announcement player is retired for this show (wave 18b; its
# module code stays): `scripts/house-macbook/install-alexa.sh --uninstall` first,
# since the router and alexa share one voice lock (scripts/house-macbook/audio.md).
audio:
  sounds_dir: media/sounds        # stagehand/media/sounds/<name>.wav — git-ignored; placeholders
                                  # from `uv run stagehand sounds placeholders`, real files replace
                                  # them (a real file always wins; `check` lists what is left)
  play_sounds: true               # the router plays every `sound X`
  announce: true                  # chime + the machine's voice (say / SAPI) on audio.json announce.to
  passthrough: true               # duplex (wave 38): the TV's input (Trabolta) is routed to the
                                  # speakers (audio.json routes) and every input is metered, so
                                  # the music ducks on the signal itself. Clippy's mic stays in
                                  # CueMix (hardware, no latency): the router only meters it.
                                  # On the MacBook fallback a launchd job needs the microphone
                                  # permission for this.
  priority:                       # dB at full activity, per bus (wave 38, C4)
    trabolta: { music: -18, sfx: -8 }    # the TV input's sidechain (audio.json role: trabolta)
    announce: { music: -15, sfx: -12 }   # the router's own announcements
    clippy:   { music: -12 }             # Clippy's wireless (role: clippy; reach: living)
                                  # (takeover: a soundtrack track silences the music on its speakers)
  sidechain:                      # a block peak over threshold_db opens a role's duck
    threshold_db: -45             # the TV's clean line (Trabolta): low, so a quiet line still ducks
    attack_s: 0.04
    hold_s: 0.8
    release_s: 1.2
    roles:                        # a role's own threshold: Clippy's open lav in the living room
      clippy: { threshold_db: -30 }   # hears the party; at -45 it would hold the music down all
                                  # night. Rehearsal: the music at party level, the lav idle, read
                                  # input 1's peak (`stagehand music status`) and set this ~6 dB over it
  no_duck: [dance_song, rave, hand_jive]   # never ducked (by anything)
  soundtrack: media/soundtrack.yaml   # wave 38 (C3): the music beds, one set per act — the
                                  # scene from `cue music_<scene>` / Night.music (the catch-up);
                                  # the MP3s go in media/music/<act>/ (git-ignored; the file's
                                  # header says which folder is which)
  mqtt: { host: 127.0.0.1, port: 1883, client_id: stagehand-audio }   # the Desktop's loopback; the MacBook fallback: the Desktop's :1884 (trapped.macbook.yaml)
                                  # show/announce, show/chime, show/audio/test, show/audio/stop,
                                  # show/audio/play, show/audio/music — all work on the LAN with
                                  # the uplink down
  say_voice: Samantha             # `say -v '?'` lists them; an Enhanced/Premium one is nicer
  chime: synth                    # or a file: chime: media/announce_chime.wav
  announce_gain_db: 0
  # Boot with the uplink down: route from these until the server answers
  # (the last answer cached in ~/Library/Caches/stagehand-audio wins when it exists).
  config_file: ../core/examples/trapped-in-the-internet/audio.json
  house_file: ../core/examples/trapped-in-the-internet/house.json

# --- the house lights (wave 20: the server room's RGB bulb, lights.json) ---
