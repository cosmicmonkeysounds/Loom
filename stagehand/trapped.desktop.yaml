# Trapped in the Internet — John's Desktop (Windows), the house PC.
#
# This file builds on trapped.house.yaml (`extends:` — every show rule, the
# sensors, the catch-up, the audio router's settings live there, once) and
# only says what differs on this machine. Keep it in the same folder.
#
# THE DESKTOP RUNS (since 2026-10-27 the sound and lights machine):
#   Mosquitto (the house broker: anonymous on 127.0.0.1:1883, password-only
#   `props` on the LAN at :1884 — scripts/house-desktop/setup-mosquitto.ps1),
#   Zigbee2MQTT on the CC2652P (COMn) with the Hue and ThirdReality ZL1
#   bulbs, the WLED strip's controller (it dials :1884), the MOTU 828x on its
#   own outs, no ADAT expander (USB 2, ASIO), the TV kiosk (Chrome, spot desktop-tv), and
#   three stagehand jobs from THIS file:
#     show    Trabolta's room cuts + the flicker (bulb by bulb), the sensors back, and the
#             `do announce` relay (show/announce): the router hears the house
#             announcements only through this job, on this broker
#     lights  lights.json (every bulb by its Z2M name, the living-room strip,
#             every lights_* / heart_* look) through Zigbee2MQTT and WLED's
#             MQTT topic; no Zigbee groups, scenes or WLED presets
#     audio   the speaker router on the 828x (below)
#   The MacBook runs the router only as the fallback (trapped.macbook.yaml,
#   dialling this PC's broker on :1884); then this PC runs show + lights.
#
#   cd stagehand
#   uv sync
#   uv run stagehand check --config trapped.desktop.yaml --only show,lights,audio
#   uv run stagehand tasks install --job show   --config trapped.desktop.yaml
#   uv run stagehand tasks install --job lights --config trapped.desktop.yaml
#   uv run stagehand tasks install --job audio  --config trapped.desktop.yaml
#   uv run stagehand tasks status                 # logs: %LOCALAPPDATA%\stagehand\logs\
#   (or scripts\house-desktop\start-stagehand.ps1, which does all of it;
#   -NoAudio in the MacBook fallback)
#
# Secrets: trapped.house.local.yaml (server: { event, mod_passcode }) applies
# here too; put anything only this PC needs in trapped.desktop.local.yaml
# (git-ignored): `server:`, a module's `mqtt:`, audio's `device` / `host_api`
# / `voice_engine` / `say_voice`.
#
# Always pass --only on this PC (show,lights,audio; show,lights in the
# MacBook fallback): one machine must never run two copies of a job.
extends: trapped.house.yaml

# show: inherited unchanged — mqtt 127.0.0.1:1883 is Mosquitto on this PC.

# --- the house lights (lights.json: the server room's RGB bulb, the Hue and ZL1 bulbs, the WLED strip) ---
# Zigbee2MQTT runs on this PC (scripts/house-desktop/zigbee2mqtt.ps1), so the
# section is on here (it is commented out in the house file).
lights:
  mqtt: { host: 127.0.0.1, port: 1883, client_id: stagehand-lights }   # Z2M's broker (loopback)
  z2m_base: zigbee2mqtt
  config_file: ../core/examples/trapped-in-the-internet/lights.json     # until the server answers
  house_file: ../core/examples/trapped-in-the-internet/house.json
  poll_wait: 25
  health_s: 15
  take_looks: true   # the show job drops any cue rule whose name lights.json defines

# --- the speaker router (its home since 2026-10-27; the MacBook is the fallback) ---
# Inherited from the house file: play_sounds, announce, passthrough: true
# (duplex: the TV input routed to the speakers, the inputs metered for the
# priority ducking), priority, sidechain, mqtt 127.0.0.1:1883 (right for
# this PC), audio.json / house.json. The show
# job reads `play_sounds` from here, so keep this section even when the
# router runs on the MacBook. What Windows needs on top
# (scripts/house-desktop/README.md §3):
#   - the 828x opened through ASIO (one 30-channel device; every other host
#     API splits it into stereo pairs). host_api: asio also sets
#     SD_ENABLE_ASIO before sounddevice loads (or set it in the environment).
#   - the device name as the ASIO driver reports it: run
#       $env:SD_ENABLE_ASIO=1; uv run python -m sounddevice
#     and put a unique part of the MOTU's ASIO line in
#     trapped.desktop.local.yaml → audio: { device: "<that>" } (audio.json
#     says "828x"; MOTU's Windows driver may call it otherwise). Then
#     `stagehand check --only audio` must show 32 in / 30 out (device.expect),
#     and every speaker needs a fresh 🔈 Test: ASIO's channel order is not
#     CoreAudio's (Main L/R 1-2, Analog 1-8 3-10, S/PDIF 11-12, Phones
#     13-14; audio.json follows it since wave 46).
#   - the voice: Windows SAPI (voice_engine: auto picks it here), female.
#   Run it from the logged-in session only (`tasks install --job audio`),
#   never as a service: ASIO drivers are unreliable from session 0. Never
#   beside the MacBook's (`stagehand launchd uninstall --job audio` there):
#   two routers would both speak every announcement.
#   - Trabolta's TV voice without a cable (wave 46: this PC has no line out):
#     Chrome's output device is "VoiceMeeter Input" (VAIO), VoiceMeeter runs
#     at sign-in with that strip on B1 only, and `tap:` sums VoiceMeeter's
#     B1 ("VoiceMeeter Output") into input 3 as if it were cabled there:
#     routed by the matrix, metered, and the music ducks under it
#     (scripts/house-desktop/README.md §3.5).
audio:
  host_api: asio
  tap: { device: "VoiceMeeter Output", host_api: mme, ch: 3 }
  voice_engine: auto                # SAPI on this PC (System.Speech through Windows PowerShell)
  say_voice: Microsoft Zira Desktop # the female desktop voice; the default female voice if absent
