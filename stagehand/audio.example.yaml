# stagehand — the house speaker router (the `audio` module), on the machine
# wired to the interface (for Oct 31, John's Desktop; the MacBook is the
# fallback, output-only: trapped.macbook.yaml).
#
#   uv run stagehand check --config audio.example.yaml        # the device vs audio.json
#   uv run stagehand run   --config audio.example.yaml --only audio
#   uv run stagehand launchd install --job audio --config trapped.macbook.yaml   # a Mac
#   uv run stagehand tasks install --job audio --config trapped.desktop.yaml     # Windows
#
# What the speakers are, which output each is wired to, the input→output
# matrix and where every story sound goes all live in the event's
# `audio.json` (the map editor's Audio panel, GET /api/mod/audio) — this
# section only says what the router is allowed to do on this machine.
#
# On the show, the `audio:` section lives in trapped.house.yaml (beside
# `show:`; the machine files extend it), not a file of its own: the `show` job reads it to know whether
# it still sends its OSC `sound X` cues. Since wave 18b the show's router
# plays every sound and the announcements (QLab and the alexa player are
# retired there); this generic example keeps both switches off.

server:
  url: "https://CHANGE-ME.example.com"
  event: "CHANGE-ME"            # or LOOM_EVENT_ID
  mod_passcode: "CHANGE-ME"     # or LOOM_MOD_PASSCODE / a git-ignored *.local.yaml

audio:
  # Story sounds: `sound printer_grind` plays sounds_dir/printer_grind.wav
  # (or .aiff / .aif / .flac / .mp3 / .ogg). A name with no file is logged once, never fatal.
  # `uv run stagehand sounds placeholders --config …` fills it with labelled
  # placeholders (media/sounds.yaml); a real file always wins over one.
  sounds_dir: media/sounds

  # Opt-in, twice (decision D6):
  play_sounds: false   # true: the router plays every `sound X`; the `show`
                       # module then skips its OSC `sound` cues (no double play)
  announce: false      # true: the router plays `do announce` (chime + `say` / SAPI)
                       # on audio.json `announce.to` — remove the `alexa:`
                       # section first (one owner of the house's voice)

  # Duplex: the audio.json routes (mics / a line / the TV on the inputs →
  # outputs) and the input meters every sidechain needs (an input with a
  # `role` in audio.json). false opens an output-only stream: no microphone
  # permission needed, but nothing is metered and no input ducks anything.
  passthrough: true
  # A software input (wave 46, audio/tap.py): a capture device summed into
  # one interface input, as if cabled there (the house PC has no line out:
  # Chrome plays into VoiceMeeter, whose B1 bus the router reads on MME).
  # A tap that fails to open is logged and the router plays on without it.
  # tap: { device: "VoiceMeeter Output", host_api: mme, ch: 3 }   # + channels: 2, gain_db: 0

  # device: "MOTU"     # override audio.json's device.name (a substring of the device name)
  # host_api: asio     # Windows: open the interface through ASIO (one N-channel device)
  # voice_engine: auto # auto (SAPI on Windows, `say` elsewhere) | say | sapi
  # rate: 48000        # default: audio.json's device.rate, else the device's own
  blocksize: 512
  latency: high        # low | high | seconds
  master_db: 0
  limit_db: -1         # each output's limiter ceiling (dBFS)
  # Priority ducking: dB at full activity, per bus (sfx = story sounds,
  # music = the soundtrack's beds), per source. A source is an audio.json
  # input `role` (its sidechain: the TV, a mic) or a built-in: `announce`
  # (an announcement playing) or `takeover` (a track that takes its
  # speakers: the music there is always silenced). A bus a source does not
  # name is not ducked by it; announcements, tests and the live inputs
  # never duck. (duck_db is gone: it is priority.announce.sfx.)
  priority:
    trabolta: { music: -18, sfx: -8 }
    announce: { music: -15, sfx: -12 }
    clippy:   { music: -12 }
  # How an input's level opens its source: a block over threshold_db opens
  # it, it holds hold_s after the last one, and fades in over attack_s and
  # out over release_s. `roles: {clippy: {threshold_db: -30}}` gives one
  # role its own threshold (an open lav hears the party; set it at rehearsal
  # about 6 dB over the idle mic's peak in `stagehand music status`).
  sidechain: { threshold_db: -45, attack_s: 0.04, hold_s: 0.8, release_s: 1.2 }
  # The soundtrack (wave 38): music beds per scene — playlists of MP3s per
  # act, crossfaded, laid on the speakers each scene names, scenes from the
  # story's `cue music_<scene>` (and `Night.music` after a restart). Story
  # `sound X` listed under its `tracks:` stream and take their speakers
  # over (the beds there fall silent). Off without it. Music files are
  # streamed, never cached; `stagehand check` lists each playlist's files
  # and flags a VBR MP3 with no length header (it would stop early). The show's:
  # soundtrack: media/soundtrack.yaml   (its header says where the files go)
  duck_hold_s: 7       # announce: false — how long each `do announce` (spoken
                       # by the alexa player) holds the announce source
  no_duck: [dance_song, rave, hand_jive]   # never ducked (the dance tracks)

  # Until the server answers (the house internet down at boot) the router
  # routes from the last audio.json it saw (cache_dir), else this file:
  # config_file: ../core/examples/trapped-in-the-internet/audio.json
  # house_file: ../core/examples/trapped-in-the-internet/house.json
  cache_dir: ~/Library/Caches/stagehand-audio
  poll_wait: 25        # the long-poll's wait (s)
  health_s: 60         # the health line (and health/audio/stats with a broker)

  # announce: true, and the speaker tests' spoken label:
  say_voice: Samantha  # `say -v '?'` lists them
  chime: synth         # synth | off | a file
  announce_gain_db: 0
  test_gain_db: -12    # the map editor's Test: a 1.5 s tone + the speaker's name

  # Optional: the LAN broker. Speaker tests, stops and sounds by hand
  #   mosquitto_pub -t show/audio/test -m '{"speaker":"desk-l"}'   (or {"out": 3})
  #   mosquitto_pub -t show/audio/stop -m '{}'                     (or {"announce": true})
  #   mosquitto_pub -t show/audio/play -m '{"name":"zip","to":["living"],"gain":-6}'
  #   mosquitto_pub -t show/audio/music -m '{"scene":"act_1"}'     (or {"next": true}, {"stop": true})
  # (`stagehand sounds stop | play` and `stagehand music scene | next | stop`
  # send the same; `stagehand music status` reads health/audio/stats), and, with announce: true,
  # announcements from the show module's show/announce rule (then never
  # from the feed, so nothing plays twice).
  # mqtt:
  #   host: 127.0.0.1
  #   port: 1883
  # announce_topic: show/announce
  # chime_topic: show/chime
  # test_topic: show/audio/test
  # stop_topic: show/audio/stop
  # play_topic: show/audio/play
  # music_topic: show/audio/music
