# stagehand — the house speaker router (the `audio` module), on the house Mac.
#
#   uv run stagehand check --config audio.example.yaml        # the device vs audio.json
#   uv run stagehand run   --config audio.example.yaml --only audio
#   uv run stagehand launchd install --job audio --config trapped.house.yaml
#
# What the speakers are, which output each is wired to, the input→output
# matrix and where every story sound goes all live in the event's
# `audio.json` (the map editor's Audio panel, GET /api/mod/audio) — this
# section only says what the router is allowed to do on this Mac.
#
# On the show, the `audio:` section lives in trapped.house.yaml (beside
# `show:`), not a file of its own: the `show` job reads it to know whether
# it still sends its OSC `sound X` cues. Since wave 18b the show's router
# plays every sound and the announcements (QLab and the alexa player are
# retired there); this generic example keeps both switches off.

server:
  url: "https://CHANGE-ME.example.com"
  event: "CHANGE-ME"            # or LOOM_EVENT_ID
  mod_passcode: "CHANGE-ME"     # or LOOM_MOD_PASSCODE / a git-ignored *.local.yaml

audio:
  # Story sounds: `sound printer_grind` plays sounds_dir/printer_grind.wav
  # (or .aiff / .aif / .flac). A name with no file is logged once, never fatal.
  # `uv run stagehand sounds placeholders --config …` fills it with labelled
  # placeholders (media/sounds.yaml); a real file always wins over one.
  sounds_dir: media/sounds

  # Opt-in, twice (decision D6):
  play_sounds: false   # true: the router plays every `sound X`; the `show`
                       # module then skips its OSC `sound` cues (no double play)
  announce: false      # true: the router plays `do announce` (chime + `say`)
                       # on audio.json `announce.to` — remove the `alexa:`
                       # section first (one owner of the house's voice)

  # The audio.json routes (mics / a line / the TV on the inputs → outputs).
  # false opens an output-only stream: no microphone permission needed.
  passthrough: true

  # device: "MOTU"     # override audio.json's device.name (a CoreAudio substring)
  # rate: 48000        # default: audio.json's device.rate, else the device's own
  blocksize: 512
  latency: high        # low | high | seconds
  master_db: 0
  limit_db: -1         # each output's limiter ceiling (dBFS)
  duck_db: -12         # sounds under an announcement
  duck_hold_s: 7       # announce: false — how long each `do announce` (spoken
                       # by the alexa player) ducks the router's sounds
  no_duck: [dance_song, rave, hand_jive]   # never ducked (the dance tracks)

  # Until the server answers (the house internet down at boot) the router
  # routes from the last audio.json it saw (cache_dir), else this file:
  # config_file: ../core/examples/trapped-in-the-internet/audio.json
  # house_file: ../core/examples/trapped-in-the-internet/house.json
  cache_dir: ~/Library/Caches/stagehand-audio
  poll_wait: 25        # the long-poll's wait (s)
  health_s: 60         # the health line (and health/audio/stats with a broker)

  # announce: true, and the speaker tests' spoken label:
  say_voice: Samantha  # `say -v '?'` lists them
  chime: synth         # synth | off | a file
  announce_gain_db: 0
  test_gain_db: -12    # the map editor's Test: a 1.5 s tone + the speaker's name

  # Optional: the LAN broker. Speaker tests, stops and sounds by hand
  #   mosquitto_pub -t show/audio/test -m '{"speaker":"desk-l"}'   (or {"out": 3})
  #   mosquitto_pub -t show/audio/stop -m '{}'                     (or {"announce": true})
  #   mosquitto_pub -t show/audio/play -m '{"name":"zip","to":["living"]}'
  # (`stagehand sounds stop | play` send the same), and, with announce: true,
  # announcements from the show module's show/announce rule (then never
  # from the feed, so nothing plays twice).
  # mqtt:
  #   host: 127.0.0.1
  #   port: 1883
  # announce_topic: show/announce
  # chime_topic: show/chime
  # test_topic: show/audio/test
  # stop_topic: show/audio/stop
  # play_topic: show/audio/play
