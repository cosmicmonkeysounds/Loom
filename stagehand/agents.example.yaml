# loom-stagehand — the agents machine (the laptop running Ollama). Copy to
# laptop.yaml and edit. This machine runs the `agents` module: it voices
# every CHARACTER marked `mind: external` that has a persona below.
#
#   ollama pull gpt-oss:20b                                    # once (the voice)
#   ollama pull tobestyledintro/qwen3.8-9b-distill:q8_0        # only for mind_mode: classic
#   uv run stagehand ask   --config laptop.yaml            # tune the persona, no server
#   uv run stagehand check --config laptop.yaml
#   uv run stagehand run   --config laptop.yaml
#
# The laptop only dials out (SSE + POST to the server); nothing dials in.

server:
  url: http://127.0.0.1:7000   # the live server, e.g. https://party.example.com
  event: default               # the event id (Run page / URL), or "default"
  mod_passcode: "CHANGE-ME"    # the event's moderator code

agents:
  name: laptop                 # how directors see this worker
  concurrency: 1               # one generation at a time on a laptop GPU
  mind_mode: new               # new: one voice call per line, the story keeps the mind
                               #   (phase cards in the mind file); classic: the two-model
                               #   mind (voice + orchestrator) as before wave 12.
                               #   ABSENT = classic, so an older YAML keeps today's mind.
  voice:                       # read only in mind_mode: new — each on | off
    memo: on                   #   he writes a ≤ 140-character note on each person as he answers
                               #   (off: no memos and no quiet summaries; the kept ones leave his prompt)
    repeat_guard: on           #   one retry when a reply repeats what this guest heard from him (his
                               #   last 3 lines to them, his thread replies); in a burst, no retry: the
                               #   sentences they heard are cut instead
    dossier_on_close: on       #   condense a quiet conversation (≥ 3 turns, 120 s idle) on the voice model
    warm_head: on              #   api: ollama — a one-token call with the shared head first, so the
                               #   prompt cache holds under gpt-oss's sliding window (~5 s → ~2 s a line)
    layout: lean               #   lean (the cached P1–P4 prompt) | classic (today's prompt, new mind)
  mind:                        # read only in mind_mode: new
    stage_from_phase: on       #   Night.phase's card sets stage, favours, drives, live powers, brief
    phase_poll_s: 30           #   the phase watch: a facts fetch every N s, no model call (0 = off)
  # The kill-switch ladder, one step at a time (then `stagehand launchd restart --job
  # agents`): voice.memo off → voice.repeat_guard off → voice.dossier_on_close off →
  # mind.stage_from_phase off → voice.layout classic → mind_mode classic (the qwen
  # model below loads again) → the server's LOOM_AGENT_RECENT=off → the previous
  # release tag (the whole checkout, never stagehand alone).
  llm:                         # the FAST model — speaks every line (seconds)
    endpoint: http://localhost:11434/v1
    model: gpt-oss:20b
    reasoning_effort: low      # gpt-oss: low ≈ a few seconds per reply
    temperature: 0.9
    max_tokens: 1000           # reasoning tokens count against this (the mind block is long)
    timeout_s: 90
    api: ollama                # native /api/chat so `keep_alive` is honoured …
    keep_alive: 60m            # … and the voice stays loaded through a quiet spell
    num_ctx: 32768             # the default: a late-night line ≈ 14–16k tokens (`stagehand check` sizes it)
  orchestrator:                # the SLOW model — grows each character's mind (classic only;
    enabled: true              #   never started in mind_mode: new) between turns; never on the reply path
    llm:
      model: tobestyledintro/qwen3.8-9b-distill:q8_0   # ollama pull … (once)
      temperature: 0.4
      max_tokens: 1200
      api: ollama              #   native /api/chat: `think` + `keep_alive` honoured
      extra:                   #   reasoning off (the OpenAI shim ignores this), and a
        think: false           #   context that fits a late-night reflect prompt (mind file +
        options: { num_ctx: 20480 }  # persona + lore + a grown mind ≈ 16k tokens; Ollama's default truncates)
      keep_alive: 60m
    quiet_s: 1.5               #   idle seconds before a reflection may start
    preempt: true              #   a new request cancels a running reflection
    survey_every_s: 120        #   look at the whole house this often
  state_dir: .stagehand-minds  # minds persist here per event + character
  characters:
    - ../core/examples/trapped-in-the-internet/trabolta.persona.md
